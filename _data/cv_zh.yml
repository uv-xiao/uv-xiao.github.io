- title: 研究方向
  type: research_story
  contents:
    paragraphs:
      - "我当前的研究聚焦面向新型 AI 芯片上大模型系统的智能体基础设施，研究智能体如何完成算子功能实现、芯片架构感知性能优化与工具链自动开发。这一方向从两个维度驱动大模型系统：一方面提升新芯片上的模型服务效率，另一方面沉淀开发数据与 trajectory，增强后续 coding 与系统智能体能力。"
      - "<strong>大模型智能体基础设施。</strong> 我当前的工作围绕新芯片上大模型基础设施的真实生命周期构建智能体：算子功能实现、架构感知性能优化与工具链自动开发。核心系统问题是：智能体流程如何连接软件意图、编译器/运行时约束、芯片特定优化机会，以及可复用的开发 trajectory。"
      - "<strong>编译器与运行时底座。</strong> 既有系统工作提供了智能体可操作的系统界面。IntelliC (<a href='https://github.com/uv-xiao/IntelliC'>GitHub</a>) 研究面向人与智能体协作的可检查编译表示。PTO Runtime (<a href='https://github.com/hw-native-sys/simpler'>GitHub</a>) 面向 Ascend 芯片和灵衢 SuperPod 执行编译后的任务图。Hive (<a href='https://arxiv.org/abs/2604.17353'>preprint</a>) 将多智能体大模型负载暴露给推理基础设施，Spine 研究跨设计意图、架构、编译器、硬件与执行证据的有界智能体协同设计。"
      - "<strong>软硬件协同基础。</strong> 我此前在编译器、e-graph、硬件综合与架构定制上的论文构成了当前智能体方向的技术基础。ISAMORE (<a href='https://doi.org/10.1145/3779212.3790162'>DOI</a>) 和 EggMind (<a href='https://arxiv.org/abs/2604.17364'>preprint</a>) 展示了形式化搜索与大模型引导搜索如何组织优化过程。Hector (<a href='https://doi.org/10.1145/3508352.3549370'>DOI</a>)、Cement (<a href='https://doi.org/10.1145/3626202.3637561'>DOI</a>)、Clay (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240669'>DOI</a>)、Cayman (<a href='https://doi.org/10.1109/DAC63849.2025.11132875'>DOI</a>)、APS (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240817'>DOI</a>, <a href='https://github.com/pku-liang/APS'>GitHub</a>)、Aquas (<a href='https://arxiv.org/abs/2511.22267'>preprint</a>) 与 SkyEgg (<a href='https://arxiv.org/abs/2511.15323'>preprint</a>) 提供了 IR、综合、运行时与协同设计方法，使智能体决策落在真实系统产物上。"
    diagram:
      title_lines:
        - "面向新型 AI 芯片的"
        - "大模型智能体基础设施"
      capabilities:
