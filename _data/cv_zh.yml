- title: 研究方向
  type: research_story
  contents:
    paragraphs:
      - "我的研究围绕敏捷芯片设计与编译优化的软硬件协同展开。核心问题是：如何把真实软件需求转化为可复用的体系结构能力，将其实现为高质量硬件，并通过可分析、可验证、可复用的编译接口重新暴露给软件栈。"
      - "<strong>架构定制。</strong> 我探索使用编译技术和形式化方法，特别是 e-graph 技术，自动化 ISA 定制和编译器适配。ISAMORE (<a href='https://doi.org/10.1145/3779212.3790162'>DOI</a>) 通过对等价程序片段进行反一化来发现可复用自定义指令。Cayman (<a href='https://doi.org/10.1109/DAC63849.2025.11132875'>DOI</a>) 从完整应用中发现加速器机会，并同时优化控制流和数据访问。APS (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240817'>DOI</a>, <a href='https://github.com/pku-liang/APS'>GitHub</a>) 和 Aquas (<a href='https://arxiv.org/abs/2511.22267'>preprint</a>) 将定制硬件能力连接到可重定向的编译器支持。"
      - "<strong>硬件综合。</strong> 我在多个抽象层次创建中间表示，并提出综合优化 pass，用于优化时序、微架构、映射和调度。Hector (<a href='https://doi.org/10.1145/3508352.3549370'>DOI</a>, <a href='https://github.com/pku-liang/Hector'>GitHub</a>) 为硬件综合方法提供多层 MLIR 基础设施。Cement (<a href='https://doi.org/10.1145/3626202.3637561'>DOI</a>) 和 Cement2 (<a href='https://arxiv.org/abs/2511.15073'>preprint</a>) 将周期时序和时间事务提升为 FPGA 设计的一等抽象。Clay (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240669'>DOI</a>) 综合微架构感知的 ASIP 指令，SkyEgg (<a href='https://arxiv.org/abs/2511.15323'>preprint</a>) 使用 e-graph 联合进行实现选择与调度。"
      - "<strong>大模型技术。</strong> 我同时探索大模型用于编译器，以及编译器/系统技术支撑大模型。EggMind (<a href='https://arxiv.org/abs/2604.17364'>preprint</a>) 使用大模型综合可复用的等式饱和策略。IntelliC (<a href='https://github.com/uv-xiao/IntelliC'>GitHub</a>) 研究面向人与智能体协作的可检查编译表示。Spine 研究验证有界的智能体协同设计，用类型化语义边界和可执行检查，将设计意图、架构描述、硬件/编译器产物和验证反馈连接成可追踪闭环。PTO Runtime (<a href='https://github.com/hw-native-sys/simpler'>GitHub</a>) 面向昇腾芯片和灵衢超节点执行编译后的任务图，用于分布式推理服务。Hive (<a href='https://arxiv.org/abs/2604.17353'>preprint</a>) 将系统视角扩展到多智能体推理基础设施。"
      - "这一闭环的逻辑是：架构定制暴露可复用硬件能力，硬件综合将其转化为高效实现，而大模型时代的技术推进既有编译和协同设计工具链，并提供持续演化的能力，使该闭环真正变得可实践、可自我改进。"
