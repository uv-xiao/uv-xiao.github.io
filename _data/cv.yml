- title: Research
  type: research_story
  contents:
    paragraphs:
      - "My research follows a <strong>compiler-driven approach to agile hardware-software co-design</strong>. Three coupled threads form a closed loop: architecture description and exploration discovers and formalizes reusable hardware capabilities; chip DSL and compilation express those capabilities and lower them into implementations; compiler optimization and LLM systems improve the resulting compiler, execution, and co-design workflows."
      - "<strong>Current kernel model and agent work.</strong> At ByteDance Seed, I create an extensible benchmark of kernel programming and optimization tasks for dataflow-architecture chips, develop a layered knowledge and skill system across multiple compilation paths, and build full-spectrum data collection and training workflows for continual model evolution. The ultimate goal is a methodology and workflow that enable models and agents to rapidly acquire expert-level kernel optimization capabilities for new chip architectures."
      - "<strong>Architecture description and exploration.</strong> I combine compiler analysis, formal methods, and architecture DSLs to represent and search design spaces while connecting customized hardware capabilities to programmable software. ISAMORE (<a href='https://doi.org/10.1145/3779212.3790162'>DOI</a>) discovers reusable custom instructions by anti-unifying equivalent program fragments; Cayman (<a href='https://doi.org/10.1109/DAC63849.2025.11132875'>DOI</a>) identifies accelerator opportunities in complete applications while co-optimizing control flow and data access; APS (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240817'>DOI</a>, <a href='https://github.com/pku-liang/APS'>GitHub</a>) and Aquas (<a href='/assets/pdf/aquas_iccad.pdf'>ICCAD 2026</a>) describe customized architectures through DSLs and expose them through complete hardware/software compiler stacks."
      - "<strong>Chip DSL and compilation.</strong> I create DSLs and intermediate representations at multiple abstraction levels, then develop compilation and synthesis passes that optimize timing, microarchitecture, implementation selection, mapping, and scheduling. Hector (<a href='https://doi.org/10.1145/3508352.3549370'>DOI</a>, <a href='https://github.com/pku-liang/Hector'>GitHub</a>) provides multi-level MLIR foundations; Cement (<a href='https://doi.org/10.1145/3626202.3637561'>DOI</a>) and Cement2 (<a href='https://arxiv.org/abs/2511.15073'>preprint</a>) introduce cycle-deterministic DSL and temporal-transaction abstractions; Clay (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240669'>DOI</a>) makes ASIP instructions microarchitecture-aware; SkyEgg (<a href='https://arxiv.org/abs/2511.15323'>preprint</a>) jointly optimizes implementation selection and scheduling with e-graphs."
      - "<strong>Compiler optimization and LLM systems.</strong> I explore LLMs for compiler and hardware-software co-design workflows, together with compiler and system support for LLM workloads. EggMind (<a href='https://arxiv.org/abs/2604.17364'>preprint</a>) synthesizes equality-saturation strategies; IntelliC (<a href='https://github.com/uv-xiao/IntelliC'>GitHub</a>) studies inspectable representations for human-model compilation; Spine (<a href='https://github.com/arch-of-shadow/spine'>GitHub</a>) organizes verification-bounded cross-layer co-synthesis; PTO Runtime (<a href='https://github.com/hw-native-sys/simpler'>GitHub</a>) supports dynamic kernel fusion and distributed execution of compiled task graphs on Ascend chips and LingQu SuperPods; Hive (<a href='https://arxiv.org/abs/2604.17353'>preprint</a>) provides multi-agent inference infrastructure."
