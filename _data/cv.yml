- title: Research
  type: research_story
  contents:
    paragraphs:
      - "<strong>Agentic LLM infrastructure.</strong> My current research centers on agents for LLM infrastructure on emerging AI chips. I evolve an abstraction-layered operator-optimization skill system and an agent-native compiler stack, connecting operator implementation, chip-architecture-aware performance optimization, and toolchain auto-development; the resulting work improves LLM serving efficiency and turns real development trajectories into training data for stronger coding and systems agents."
      - "<strong>Native multi-agent coding systems.</strong> I contribute to multi-agent orchestration strategies and workflow customization for long-horizon systems development, using programmable concurrency and human-in-the-loop workflows."
      - "<strong>Compiler and runtime substrates.</strong> Earlier systems work provides the surfaces that agents can operate on. IntelliC (<a href='https://github.com/uv-xiao/IntelliC'>GitHub</a>) studies inspectable compiler representations for human-agent collaboration. PTO Runtime (<a href='https://github.com/hw-native-sys/simpler'>GitHub</a>) executes compiled task graphs for serving on Ascend chips and LingQu SuperPods. Hive (<a href='https://arxiv.org/abs/2604.17353'>preprint</a>) exposes multi-agent LLM workloads to inference infrastructure, while Spine (<a href='https://github.com/arch-of-shadow/spine'>GitHub</a>) studies bounded agentic co-design across design intent, architecture, compiler, hardware, and execution evidence."
      - "<strong>Compiler-driven agile chip design.</strong> My earlier research treats compilers as the organizing layer for architecture customization and hardware-software co-design. Hector (<a href='https://doi.org/10.1145/3508352.3549370'>DOI</a>, <a href='https://github.com/pku-liang/Hector'>GitHub</a>) provides multi-level IRs for hardware synthesis; Cement (<a href='https://doi.org/10.1145/3626202.3637561'>DOI</a>) couples the cycle-deterministic CmtHDL DSL with the CmtC timing-analysis and control-synthesis compiler; APS (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240817'>DOI</a>, <a href='https://github.com/pku-liang/APS'>GitHub</a>) builds an open-source MLIR stack from architecture DSLs to hardware synthesis and software compilation, and Aquas (<a href='https://arxiv.org/abs/2511.22267'>preprint</a>) extends it with domain-specific memory/synthesis directives and an e-graph retargetable compiler. Clay (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240669'>DOI</a>), Cayman (<a href='https://doi.org/10.1109/DAC63849.2025.11132875'>DOI</a>), and SkyEgg (<a href='https://arxiv.org/abs/2511.15323'>preprint</a>) automate microarchitecture and accelerator optimization, while ISAMORE (<a href='https://doi.org/10.1145/3779212.3790162'>DOI</a>) and EggMind (<a href='https://arxiv.org/abs/2604.17364'>preprint</a>) structure compiler search with formal and LLM-guided methods."
