- title: Research
  type: research_story
  contents:
    paragraphs:
      - "My current research focuses on agentic infrastructure for LLM systems on emerging AI chips. I study how agents can implement operators, optimize performance with chip-architecture awareness, and automate toolchain development. This agenda drives LLM systems from two sides: improving model-serving efficiency on new chips, and producing development data and trajectories that strengthen future coding and systems agents."
      - "<strong>Agentic LLM infrastructure.</strong> My current work builds agents around the real lifecycle of LLM infrastructure on new chips: operator implementation, architecture-aware performance optimization, and toolchain auto-development. The key systems question is how agent workflows can connect software intent, compiler/runtime constraints, chip-specific optimization opportunities, and reusable development trajectories."
      - "<strong>Compiler and runtime substrates.</strong> Earlier systems work provides the surfaces that agents can operate on. IntelliC (<a href='https://github.com/uv-xiao/IntelliC'>GitHub</a>) studies inspectable compiler representations for human-agent collaboration. PTO Runtime (<a href='https://github.com/hw-native-sys/simpler'>GitHub</a>) executes compiled task graphs for serving on Ascend chips and LingQu SuperPods. Hive (<a href='https://arxiv.org/abs/2604.17353'>preprint</a>) exposes multi-agent LLM workloads to inference infrastructure, while Spine studies bounded agentic co-design across design intent, architecture, compiler, hardware, and execution evidence."
      - "<strong>Co-design foundations.</strong> My publications in compilers, e-graphs, hardware synthesis, and architecture customization form the technical base for the current agent agenda. ISAMORE (<a href='https://doi.org/10.1145/3779212.3790162'>DOI</a>) and EggMind (<a href='https://arxiv.org/abs/2604.17364'>preprint</a>) show how formal and LLM-guided search can structure optimization. Hector (<a href='https://doi.org/10.1145/3508352.3549370'>DOI</a>), Cement (<a href='https://doi.org/10.1145/3626202.3637561'>DOI</a>), Clay (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240669'>DOI</a>), Cayman (<a href='https://doi.org/10.1109/DAC63849.2025.11132875'>DOI</a>), APS (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240817'>DOI</a>, <a href='https://github.com/pku-liang/APS'>GitHub</a>), Aquas (<a href='https://arxiv.org/abs/2511.22267'>preprint</a>), and SkyEgg (<a href='https://arxiv.org/abs/2511.15323'>preprint</a>) provide IR, synthesis, runtime, and co-design methods that ground agent decisions in real systems artifacts."
