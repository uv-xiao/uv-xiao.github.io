- title: Research
  type: research_story
  contents:
    paragraphs:
      - "My research builds compiler-centered hardware-software co-design systems for domain-specific computing, and more recently innovative agents that advance kernel development on new chips. The central problem is how real software demands can be translated into reusable architectural capabilities, realized as high-quality hardware, and exposed back to software through compiler interfaces and agentic workflows that remain analyzable, verifiable, and reusable."
      - "<strong>Architecture customization.</strong> I explored compiler techniques and formal methods, especially e-graphs, to automate ISA customization and compiler adaptation. ISAMORE (<a href='https://doi.org/10.1145/3779212.3790162'>DOI</a>) finds reusable custom instructions by anti-unifying equivalent program fragments. Cayman (<a href='https://doi.org/10.1109/DAC63849.2025.11132875'>DOI</a>) discovers accelerator opportunities from whole applications while optimizing control flow and data access. APS (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240817'>DOI</a>, <a href='https://github.com/pku-liang/APS'>GitHub</a>) and Aquas (<a href='https://arxiv.org/abs/2511.22267'>preprint</a>) connect customized hardware capabilities to retargetable compiler support."
      - "<strong>Hardware synthesis.</strong> I created intermediate representations at multiple abstraction levels and proposed synthesis passes that optimize timing, microarchitecture, mapping, and scheduling. Hector (<a href='https://doi.org/10.1145/3508352.3549370'>DOI</a>, <a href='https://github.com/pku-liang/Hector'>GitHub</a>) provides a multi-level MLIR substrate for hardware synthesis. Cement (<a href='https://doi.org/10.1145/3626202.3637561'>DOI</a>) and Cement2 (<a href='https://arxiv.org/abs/2511.15073'>preprint</a>) make cycle timing and temporal transactions first-class FPGA design abstractions. Clay (<a href='https://doi.org/10.1109/ICCAD66269.2025.11240669'>DOI</a>) synthesizes microarchitecture-aware ASIP instructions, while SkyEgg (<a href='https://arxiv.org/abs/2511.15323'>preprint</a>) uses e-graphs for joint implementation selection and scheduling."
      - "<strong>LLM techniques.</strong> I explored both LLMs for compilers and compiler/system techniques for LLMs, including innovative agents for accelerating kernel development on new chips. EggMind (<a href='https://arxiv.org/abs/2604.17364'>preprint</a>) uses LLMs to synthesize reusable equality-saturation strategies. IntelliC (<a href='https://github.com/uv-xiao/IntelliC'>GitHub</a>) studies inspectable compiler representations for human and agent collaboration. Spine studies verification-bounded agentic co-design, using typed semantic boundaries and executable checks to connect design intent, architecture descriptions, hardware/compiler artifacts, and validation feedback in a traceable closed loop. PTO Runtime (<a href='https://github.com/hw-native-sys/simpler'>GitHub</a>) executes compiled task graphs for serving on Ascend chips and LingQu SuperPods. Hive (<a href='https://arxiv.org/abs/2604.17353'>preprint</a>) extends the systems view to multi-agent inference infrastructure."
      - "The closed loop is that architecture customization exposes reusable hardware capabilities, hardware synthesis turns them into efficient implementations, and LLM-era techniques advance the earlier compiler and co-design toolchains while providing evolving capabilities that make the loop practical and self-improving."
